<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a49"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><title>LungCare Mobile</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#102a49;--muted:#667085;--line:#e5eaf1;--blue:#1f6feb;--green:#16794b;--amber:#b7791f;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.app{min-height:100dvh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#102a49,#1f6feb);display:grid;place-items:center;color:white;font-weight:900}.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:10px}.main{padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(16,24,40,.06);margin-bottom:12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.hero h1{font-size:25px;line-height:1.1;margin:7px 0}.hero p{font-size:13px;color:var(--muted);line-height:1.5}.metric-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.metric small,.metric b{display:block}.metric small{font-size:10px;color:var(--muted);font-weight:800}.metric b{font-size:16px;margin-top:4px}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:white;font-weight:800;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);width:100%}.btn.red{background:#fff0ee;color:var(--red);border-color:#f1b8b2;width:100%}.role-picker{display:grid;gap:9px;margin-top:18px}.role-picker button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:white;border-radius:16px;padding:14px;text-align:left}.role-picker span{font-size:25px}.role-picker small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.green{background:#ecfdf3;color:var(--green)}.amber{background:#fff7e6;color:var(--amber)}.red{background:#fff0ee;color:var(--red)}.chat{background:#f8fafc;border-radius:14px;padding:11px;font-size:13px;line-height:1.45}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(16,42,73,.97);padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;gap:5px}.nav button{flex:1;background:transparent;color:#cfe0f5;border:0;border-radius:10px;padding:8px 3px;font-size:10px;font-weight:800}.nav button.active{background:white;color:var(--ink)}.alert{background:#fff0ee;border:1px solid #f1b8b2;color:var(--red);padding:11px;border-radius:14px;font-size:12px;font-weight:750;margin-bottom:12px}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:5px 0 10px}.login{text-align:center;padding:12vh 8px}.login h1{font-size:27px}.disclaimer{color:#98a2b3;font-size:10px;line-height:1.4;margin-top:14px}.desktop-link{font-size:11px;color:var(--blue);text-decoration:none}
</style>
</head><body><div class="app"><header class="top"><div class="brand"><div class="logo">LC</div><div><b>LungCare Mobile</b><small id="roleLabel">Bản demo cài được · mô phỏng</small></div></div><span id="mode" class="status green">OFFLINE-READY</span></header><main id="app" class="main"></main><nav id="nav" class="nav"></nav></div>
<script src="../consistency-engine.js"></script><script>
const KEY='lungcare.mobile.demo';const base={patient:{name:'Nguyễn Văn Minh',code:'LC-871748',therapy:'Osimertinib 80mg/ngày'},report:{symptom:'',diarrhea:0,fever:false,dyspnea:false,submittedAt:null,priority:'stable'}};let state=JSON.parse(localStorage.getItem(KEY)||'null')||base;let role=new URLSearchParams(location.search).get('role')||localStorage.getItem('lungcare.mobile.role')||null;let tab='home';const app=document.getElementById('app'),nav=document.getElementById('nav');
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem('lungcare.mobile.role',role)}function setRole(r){role=r;tab='home';save();render()}function setTab(t){tab=t;render()}
function login(){app.innerHTML=`<section class="login"><div class="logo" style="margin:auto">LC</div><div class="eyebrow">LungCare Mobile · Đăng nhập mô phỏng</div><h1>Chọn vai trò</h1><p class="hero p">Mở trên 3 điện thoại, chọn 3 vai trò để diễn tập Patient → Nurse → Doctor. Đây không phải tài khoản thật.</p><div class="role-picker"><button onclick="setRole('patient')"><span>👴</span><div><b>Người bệnh</b><small>Khai bệnh, thuốc, triệu chứng, hỗ trợ</small></div></button><button onclick="setRole('nurse')"><span>👩‍⚕️</span><div><b>Điều dưỡng</b><small>Tiếp nhận, xác minh, điều phối</small></div></button><button onclick="setRole('doctor')"><span>👨‍⚕️</span><div><b>Bác sĩ</b><small>Review consistency, quyết định, sign-off</small></div></button></div><p class="disclaimer">Mô phỏng offline · không thay EMR/HIS · không tự chẩn đoán/kê đơn.</p></section>`;nav.innerHTML=''}
function patient(){return `<div class="hero"><div class="eyebrow">Người bệnh · Hôm nay</div><h1>Chào chú Minh</h1><p>Chỉ những việc chú cần làm hôm nay.</p></div>${tab==='home'?`<section class="card"><div class="eyebrow">Thuốc hôm nay</div><h2>💊 ${state.patient.therapy}</h2><p>Uống 1 viên lúc 08:00.</p><button class="btn primary" onclick="state.report.taken=true;save();render()">${state.report.taken?'✓ Đã uống':'Xác nhận đã uống'}</button></section><section class="card"><b>Hôm nay chú thấy thế nào?</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" onclick="setTab('health')">😊 Bình thường</button><button class="btn red" onclick="setTab('health')">⚠️ Báo triệu chứng</button></div></section>`:tab==='health'?`<section class="card"><h2>Nhật ký sức khỏe</h2><label>Triệu chứng<select class="input" id="sym"><option>Không có triệu chứng mới</option><option>Tiêu chảy</option><option>Ban da</option><option>Khó thở</option><option>Đau ngực</option></select></label><label>Số lần đi ngoài<input class="input" id="dia" type="number" value="${state.report.diarrhea}"></label><label><input id="fev" type="checkbox"> Có sốt</label><button class="btn primary" onclick="submitReport()">Gửi khai bệnh</button></section>`:tab==='treatment'?`<section class="card"><h2>Điều trị của tôi</h2><div class="metric-row"><div class="metric"><small>THUỐC</small><b>Osimertinib</b></div><div class="metric"><small>ĐÁP ỨNG</small><b>PR -34%</b></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="alert('Mở hồ sơ điều trị đầy đủ')">📄 Hồ sơ điều trị</button></section>`:tab==='support'?`<section class="card"><h2>Hỗ trợ</h2><div class="chat">🤖 Trợ lý AI 24/7 sẵn sàng giải đáp và phát hiện dấu hiệu cần báo ngay.</div><button class="btn primary" style="margin-top:10px" onclick="alert('Mở trợ lý AI đầy đủ')">Mở Trợ lý AI</button></section>`:`<section class="card"><h2>Tôi</h2><p>${state.patient.name} · ${state.patient.code}</p><button class="btn" onclick="role=null;localStorage.removeItem('lungcare.mobile.role');render()">Đổi vai trò demo</button></section>`}${patientNav()}`}
function patientNav(){return `<nav class="nav">${[['home','🏠','Hôm nay'],['health','❤️','Sức khỏe'],['treatment','💊','Điều trị'],['support','🤝','Hỗ trợ'],['profile','👤','Tôi']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function submitReport(){const r=state.report;r.symptom=document.getElementById('sym').value;r.diarrhea=Number(document.getElementById('dia').value)||0;r.fever=document.getElementById('fev').checked;r.submittedAt=new Date().toLocaleString('vi-VN');r.priority=(r.symptom==='Khó thở'||r.symptom==='Đau ngực')?'urgent':(r.diarrhea>=4||r.fever)?'review_today':'stable';save();setTab('home')}
function clinician(){const urgent=state.report.priority==='urgent';return `<div class="hero"><div class="eyebrow">${role==='doctor'?'Bác sĩ':'Điều dưỡng'} · Chăm sóc khép kín</div><h1>${role==='doctor'?'Cần review gì?':'Cần xử lý gì?'}</h1><p>Ca ${state.patient.code} · một trạng thái lâm sàng dùng chung.</p></div>${state.report.submittedAt?`<section class="card ${urgent?'alert':''}"><b>Báo cáo mới từ người bệnh</b><p>${state.report.symptom||'Không có triệu chứng mới'} · Tiêu chảy ${state.report.diarrhea} lần · ${state.report.fever?'Có sốt':'Không sốt'} · ${state.report.submittedAt}</p><small>${urgent?'KHẨN: cần đánh giá ngay':'Cần xác minh theo quy trình'}</small></section>`:''}<section class="card"><div class="eyebrow">Clinical Consistency Engine · mô phỏng</div><h2>3 mâu thuẫn cần đối chiếu</h2><p>Safety labs vs data gap · TNM vs metastatic sites · RECIST vs imaging missing.</p><button class="btn primary">Mở review</button></section><section class="card"><div class="metric-row"><div class="metric"><small>ĐÁP ỨNG</small><b>PR -34%</b></div><div class="metric"><small>THUỐC</small><b>Osimertinib</b></div></div></section>${['home','tasks','more'].map((t,i)=>i===0?'': '').join('')}${clinicianNav()}`}
function clinicianNav(){return `<nav class="nav">${[['home','🏠','Tổng quan'],['tasks','⚡','Cần xử lý'],['more','⋯','Thêm']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function render(){if(!role){login();return}document.getElementById('roleLabel').textContent=role==='patient'?'Người bệnh · mô phỏng':role==='nurse'?'Điều dưỡng · mô phỏng':'Bác sĩ · mô phỏng';app.innerHTML=role==='patient'?patient():clinician()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
