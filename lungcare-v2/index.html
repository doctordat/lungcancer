<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#102a49" />
  <title>LungCare V2 · Consistency Engine Preview</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#12233a;--muted:#667085;--line:#e5eaf1;--blue:#1f6feb;--navy:#102a49;--green:#16794b;--amber:#b7791f;--red:#b42318;--shadow:0 10px 30px rgba(16,24,40,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;background:rgba(244,247,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.role-tabs{display:flex;gap:5px;background:#e9eef5;padding:4px;border-radius:12px}.role-tabs button{border:0;background:transparent;border-radius:9px;padding:7px 10px;color:#667085;font-size:12px;font-weight:800}.role-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.06)}main{padding:22px 20px}.hero{margin-bottom:18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.hero h1{font-size:28px;letter-spacing:-.04em;margin:6px 0}.hero p{color:var(--muted);margin:0;line-height:1.5}.banner{background:linear-gradient(135deg,var(--navy),#1d4f83);color:white;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 14px 30px rgba(16,42,73,.15)}.banner small{color:#cfe0f5}.banner h2{margin:5px 0;font-size:20px}.banner p{margin:0;color:#dbe7f4;font-size:13px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:16px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cardhead b{font-size:15px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.pill.green{background:#ecfdf3;color:var(--green)}.pill.amber{background:#fff7e6;color:var(--amber)}.pill.red{background:#fff0ee;color:var(--red)}.issue{border:1px solid var(--line);border-left:4px solid var(--amber);padding:12px;border-radius:14px;margin:9px 0;background:#fffdf8}.issue.high{border-left-color:var(--red);background:#fff8f7}.issue h3{font-size:14px;margin:0 0 5px}.issue p{font-size:12.5px;color:#475467;line-height:1.45;margin:4px 0}.issue small{font-size:11px;color:var(--muted)}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px}.metric small,.metric b{display:block}.metric small{font-size:10px;color:var(--muted);font-weight:800}.metric b{font-size:17px;margin-top:4px}.state-list{display:grid;gap:8px}.state-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.state-row:last-child{border-bottom:0}.state-row span{color:var(--muted);text-align:right}.flow{display:flex;gap:8px;overflow:auto;margin:10px 0}.flow div{min-width:145px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.flow b{display:block;font-size:12px}.flow small{color:var(--muted);font-size:11px}.footer{color:#98a2b3;font-size:11px;line-height:1.5;padding:2px 2px 30px}.mobile-nav{display:none}@media(max-width:680px){.top{padding:11px 12px}.top .role-tabs{display:none}main{padding:16px 12px 88px}.hero h1{font-size:23px}.grid{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(2,1fr)}.card{border-radius:17px;padding:14px}.banner{border-radius:16px;padding:15px}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;z-index:10;background:rgba(16,42,73,.97);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}.mobile-nav button{flex:1;border:0;background:transparent;color:#cfe0f5;padding:9px 5px;border-radius:10px;font-size:11px;font-weight:800}.mobile-nav button.active{background:#fff;color:var(--navy)}}
  </style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">LC</div><div><b>LungCare V2</b><small>Hệ điều hành chăm sóc ung thư · BẢN MÔ PHỎNG</small></div></div><div class="role-tabs"><button class="active" data-role="doctor">Bác sĩ</button><button data-role="nurse">Điều dưỡng</button></div></header>
<main id="app"></main>
<nav class="mobile-nav"><button class="active" data-role="doctor">🩺<br>Bác sĩ</button><button data-role="nurse">📋<br>Điều dưỡng</button><button onclick="alert('AN TOÀN overlay luôn ưu tiên khi có Red Alert')">🚨<br>AN TOÀN</button></nav>
</div>
<script src="./consistency-engine.js"></script>
<script>
const STORAGE='lungcare.v2.state';
const demoState={patient:{name:'Nguyễn Văn Minh',code:'LC-871748',diagnosis:'Ung thư phổi không tế bào nhỏ (NSCLC)',stage:'IVA',tnm:'cT2bN2M1a',therapy:'Osimertinib 80 mg/ngày',week:6},patientReport:{symptom:'',diarrhea:0,fever:false,dyspnea:false,note:'',submittedAt:null,priority:'stable'},careLoop:{plan:{planId:'PLAN-LC-01',revision:1}},safetyLabs:{qtc:{value:432,unit:'ms'},potassium:{value:4.1,unit:'mmol/L'}},medicationAN TOÀN:{checks:[{id:'labs',value:'QTc/điện giải chưa có'}]},recist:{sumCurrent:33,sumChangePct:-34,overallĐÁP ỨNG:'PR (Đáp ứng một phần)',nonTargetStatus:'Di căn xương ghi nhận trong mô phỏng'},decisionBrief:{safetyGates:[{label:'CT tuần 8 / imaging',status:'missing'}]}};
let role=new URLSearchParams(location.search).get('role')||'patient';
const saved=localStorage.getItem(STORAGE); if(saved) Object.assign(demoState, JSON.parse(saved));
const app=document.getElementById('app');
function classifyReport(){const r=demoState.patientReport; r.priority=(r.dyspnea||r.fever&&r.symptom==='Đau ngực')?'urgent':(r.diarrhea>=4||r.fever)?'review_today':'stable'; return r;}
function submitPatientReport(){const r=classifyReport();r.submittedAt=new Date().toLocaleString('vi-VN');localStorage.setItem(STORAGE,JSON.stringify(demoState));render();}
function setRole(next){role=next;const u=new URL(location.href);u.searchParams.set('role',next);history.replaceState(null,'',u);render();}
function patientView(){const r=demoState.patientReport;return `<div class="hero"><div class="eyebrow">Ứng dụng Người bệnh · Hôm nay</div><h1>Chào chú Minh</h1><p class="lead">Khai nhanh tình trạng hôm nay để đội điều trị theo dõi an toàn.</p></div><section class="card"><div class="cardhead"><b>Thuốc hôm nay</b><span class="pill green">Đang dùng</span></div><div class="metric-row"><div class="metric"><small>THUỐC</small><b>Osimertinib</b></div><div class="metric"><small>LIỀU</small><b>80 mg</b></div><div class="metric"><small>GIỜ UỐNG</small><b>08:00</b></div><div class="metric"><small>ĐÃ UỐNG</small><b>41/42</b></div></div></section><section class="card intake-card"><div class="cardhead"><b>Hôm nay chú thấy thế nào?</b><span class="pill ${r.priority==='urgent'?'red':r.priority==='review_today'?'amber':'green'}">${r.submittedAt?'Đã gửi':'Chưa gửi'}</span></div><label>Triệu chứng chính<select id="patientSymptom"><option value="">Không có triệu chứng mới</option><option>Tiêu chảy</option><option>Ban da</option><option>Đau ngực</option><option>Khó thở</option></select></label><label>Số lần đi ngoài phân lỏng hôm nay<input id="patientDiarrhea" type="number" min="0" max="30" value="${r.diarrhea}"></label><label><input id="patientFever" type="checkbox" ${r.fever?'checked':''}> Có sốt</label><label><input id="patientDyspnea" type="checkbox" ${r.dyspnea?'checked':''}> Có khó thở mới xuất hiện</label><label>Ghi chú thêm<textarea id="patientNote" placeholder="Điều gì đã thay đổi?">${r.note}</textarea></label><button class="btn primary full" onclick="submitPatientCheckin()">Gửi khai bệnh cho đội điều trị</button><small>Thông tin do người bệnh tự báo cáo; chưa phải chẩn đoán.</small></section><section class="card"><div class="cardhead"><b>Việc tiếp theo</b><span class="pill blue">Tái khám</span></div><div class="state-row"><b>Ngày hẹn</b><span>12/09 · 08:30</span></div><div class="state-row"><b>Hỗ trợ khẩn cấp</b><span>Khó thở/đau ngực/ngất → gọi cấp cứu địa phương</span></div></section>`}
function submitPatientCheckin(){const r=demoState.patientReport;r.symptom=document.getElementById('patientSymptom').value;r.diarrhea=Number(document.getElementById('patientDiarrhea').value)||0;r.fever=document.getElementById('patientFever').checked;r.dyspnea=document.getElementById('patientDyspnea').checked;r.note=document.getElementById('patientNote').value;submitPatientReport();}
function render(){const s=LungCareConsistency.buildClinicalState(demoState),issues=LungCareConsistency.detectConsistencyIssues(s);if(role==='patient'){app.innerHTML=patientView()+`<div class="mobile-nav"><button class="active">🏠<br>Hôm nay</button><button onclick="alert('Mở Nhật ký sức khỏe')">❤️<br>Sức khỏe</button><button onclick="alert('Mở Điều trị')">💊<br>Điều trị</button><button onclick="alert('Mở Hỗ trợ')">🤝<br>Hỗ trợ</button><button onclick="alert('Mở Hồ sơ')">👤<br>Tôi</button></div>`;return;}app.innerHTML=`<div class="hero"><div class="eyebrow">${role==='doctor'?'Khu làm việc Bác sĩ':'Trung tâm Điều dưỡng'} · Một trạng thái lâm sàng thống nhất</div><h1>${role==='doctor'?'Cần review gì?':'Cần xử lý gì?'}</h1><p>${role==='doctor'?'Tóm tắt 10 giây, mở chi tiết khi cần.':'Ưu tiên tín hiệu, xác minh trước khi chuyển bác sĩ.'}</p></div>`<div class="banner"><small>TRẠNG THÁI LÂM SÀNG TRỰC TIẾP · MÔ PHỎNG</small><h2>${issues.length} vấn đề cần đối chiếu</h2><p>Engine chỉ phát hiện và giải thích; không tự sửa hồ sơ, không chốt điều trị.</p></div>${demoState.patientReport.submittedAt ? `<section class="card report-card ${demoState.patientReport.priority}"><div class="cardhead"><b>Báo cáo mới từ người bệnh</b><span class="pill ${demoState.patientReport.priority==='urgent'?'red':demoState.patientReport.priority==='review_today'?'amber':'green'}">${demoState.patientReport.priority==='urgent'?'KHẨN':demoState.patientReport.priority==='review_today'?'CẦN XEM HÔM NAY':'ỔN ĐỊNH'}</span></div><p><strong>${demoState.patientReport.symptom || 'Không có triệu chứng mới'}</strong> · Tiêu chảy ${demoState.patientReport.diarrhea} lần/ngày · ${demoState.patientReport.fever?'Có sốt':'Không sốt'} · ${demoState.patientReport.dyspnea?'Có khó thở':'Không khó thở'}</p><small>Người bệnh tự khai lúc ${demoState.patientReport.submittedAt}; cần điều dưỡng xác minh.</small></section>` : ''}<div class="grid"><section class="card"><div class="cardhead"><b>${role==='doctor'?'Bộ kiểm tra nhất quán lâm sàng':'Hàng đợi ưu tiên'}</b><span class="pill amber">${issues.length} review</span></div>${issues.map(i=>`<article class="issue ${i.severity}"><h3>${i.title}</h3><p><b>Ảnh hưởng:</b> ${i.affectedFields.join(' · ')}</p><p>${i.explanation}</p><small><b>Action:</b> ${i.reviewAction}</small><br><small>Source: ${i.provenance}</small></article>`).join('')}</section><section class="card"><div class="cardhead"><b>${role==='doctor'?'Tóm tắt lâm sàng 10 giây':'Tóm tắt hàng đợi'}</b><span class="pill green">${s.patient.code}</span></div><div class="metric-row"><div class="metric"><small>DISEASE</small><b>NSCLC IVA</b></div><div class="metric"><small>THERAPY</small><b>TKI · W6</b></div><div class="metric"><small>RESPONSE</small><b>PR -34%</b></div><div class="metric"><small>SAFETY</small><b>QTcF 432</b></div></div><div class="state-list"><div class="state-row"><b>Điều gì thay đổi?</b><span>Tiêu chảy G2 · response PR</span></div><div class="state-row"><b>Điều gì quan trọng?</b><span>TNM + safety documentation cần reconcile</span></div><div class="state-row"><b>Quyết định tiếp theo</b><span>Clinician review/sign-off</span></div></div></section></div><section class="card"><div class="cardhead"><b>Chăm sóc khép kín</b><span class="pill green">1 trạng thái dùng chung</span></div><div class="flow"><div><b>Người bệnh báo cáo</b><small>Nhật ký / triệu chứng</small></div><div><b>Điều dưỡng xác minh</b><small>Triage / tiếp nhận</small></div><div><b>Engine phân tích</b><small>Vấn đề + ưu tiên</small></div><div><b>Bác sĩ xác nhận</b><small>Quyết định + kế hoạch</small></div><div><b>Người bệnh thực hiện</b><small>Kế hoạch chăm sóc</small></div></div></section><div class="footer">LungCare V2 simulated preview · Clinical Decision Support, không phải EMR/HIS. Mọi quyết định điều trị cần clinician review và sign-off.</div>`}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));render();
</script>
</body></html>
